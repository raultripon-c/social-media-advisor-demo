# Default server configuration
# Config customised for tipaas-ui
server {
	include	mime.types;
	
	listen 80 default_server;
	listen [::]:80 default_server;

	# Modified for tipaas-ui
	index index.html;

	server_name _;

	location / {
		root /var/www/html;
		# All $uri should be directed to /index.html. All routing will be handled at the client side by 
		# front-end code
		try_files $uri $uri/ /index.html;
	}
	add_header X-XSS-Protection "1; mode=block"; 
	add_header X-Content-Type-Options: "nosniff"; 
	add_header Cache-Control: "no-store";
	add_header Access-Control-Allow-Methods: "GET, POST, PUT, DELETE, HEAD, OPTIONS, PATCH";
	add_header Content-Security-Policy "default-src 'self' https: localhost:*; script-src 'unsafe-inline' 'unsafe-eval' https: localhost:*; connect-src https: localhost:* *.phenompro.com *.phenom.com ws://localhost:*; style-src 'unsafe-inline' https:; object-src 'none'; img-src * data: ;worker-src 'self' blob: *.phenom.com;";

	# Gzip compression settings
	gzip on;
	gzip_disable "msie6";
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;  # Consider adjusting to a balance between performance and compression ratio
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_min_length 256;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;
}